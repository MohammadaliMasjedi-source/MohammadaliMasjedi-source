<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 184" role="img" aria-labelledby="title desc"><title id="title">How four answers move one flashcard</title><desc id="desc">Good advances one box, again resets to box one, hard stays in place, and easy advances two boxes. The waits are two, one, one and four days.</desc><rect width="660" height="184" rx="10" fill="#e6eee1"/><g font-family="system-ui,sans-serif" fill="#183c37"><text x="22" y="27" font-size="12" font-weight="700" letter-spacing="2">ONE CARD · FOUR REVIEWS</text><g font-size="16" font-weight="700"><text x="22" y="68">1 · GOOD</text><text x="183" y="68">2 · AGAIN</text><text x="344" y="68">3 · HARD</text><text x="505" y="68">4 · EASY</text></g><g font-size="15"><text x="22" y="99">Box 1 → 2</text><text x="183" y="99">Box 2 → 1</text><text x="344" y="99">Box 1 → 1</text><text x="505" y="99">Box 1 → 3</text></g><g fill="#215c51"><rect x="22" y="118" width="56" height="12" rx="3"/><rect x="183" y="118" width="28" height="12" rx="3"/><rect x="344" y="118" width="28" height="12" rx="3"/><rect x="505" y="118" width="112" height="12" rx="3"/></g><g font-size="14"><text x="22" y="155">Wait 2 days</text><text x="183" y="155">Wait 1 day</text><text x="344" y="155">Wait 1 day</text><text x="505" y="155">Wait 4 days</text></g></g></svg>
